{% extends 'base.html' %}

{% block content %}
<div
    style="min-height: calc(100vh - 300px); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%); padding: 2rem;">
    <div
        style="background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); max-width: 450px; width: 100%;">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div
                style="background: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%); width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);">
                <i class="fas fa-sign-in-alt" style="font-size: 2.5rem; color: white;"></i>
            </div>
            <h2 style="color: #1F2937; font-size: 2rem; margin-bottom: 0.5rem; font-weight: 800;">Welcome Back</h2>
            <p style="color: #6B7280; font-size: 1rem;">Sign in to access your library account</p>
        </div>

        <!-- Login Form -->
        <form method="post" action="{{ url_for('login') }}">
            <!-- Username/Email Field -->
            <div style="margin-bottom: 1.5rem;">
                <label for="username"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-user" style="color: #4F46E5; margin-right: 0.5rem;"></i>Username or Email
                </label>
                <input type="text" id="username" name="username" required placeholder="Enter your username or email"
                    style="width: 100%; padding: 0.75rem 1rem 0.75rem 3rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s; background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22%234F46E5%22><path d=%22M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z%22/></svg>') no-repeat 1rem center; background-color: white;">
            </div>

            <!-- Password Field -->
            <div style="margin-bottom: 2rem;">
                <label for="password"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-lock" style="color: #4F46E5; margin-right: 0.5rem;"></i>Password
                </label>
                <input type="password" id="password" name="password" required placeholder="Enter your password"
                    style="width: 100%; padding: 0.75rem 1rem 0.75rem 3rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s; background: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2216%22 height=%2216%22 viewBox=%220 0 24 24%22 fill=%22%234F46E5%22><path d=%22M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z%22/></svg>') no-repeat 1rem center; background-color: white;">
            </div>

            <!-- Submit Button -->
            <button type="submit"
                style="width: 100%; background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%); color: white; padding: 0.875rem; border-radius: 10px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <!-- Register Link -->
        <div style="margin-top: 2rem; text-align: center; padding-top: 1.5rem; border-top: 2px solid #F3F4F6;">
            <p style="color: #6B7280; font-size: 0.95rem;">
                Don't have an account?
                <a href="{{ url_for('register') }}"
                    style="color: #4F46E5; font-weight: 600; text-decoration: none; transition: all 0.3s;">
                    <i class="fas fa-user-plus"></i> Create Account
                </a>
            </p>
        </div>
    </div>
</div>

<style>
    input:focus {
        outline: none;
        border-color: #4F46E5 !important;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1) !important;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4) !important;
    }

    button:active {
        transform: translateY(0);
    }
</style>
{% endblock %}
