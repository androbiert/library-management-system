{% extends 'base.html' %}

{% block content %}
<div
    style="min-height: calc(100vh - 300px); display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #F3F4F6 0%, #E5E7EB 100%); padding: 2rem;">
    <div
        style="background: white; padding: 3rem; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.1); max-width: 500px; width: 100%;">
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div
                style="background: linear-gradient(135deg, #10B981 0%, #059669 100%); width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);">
                <i class="fas fa-user-plus" style="font-size: 2.5rem; color: white;"></i>
            </div>
            <h2 style="color: #1F2937; font-size: 2rem; margin-bottom: 0.5rem; font-weight: 800;">Create Account</h2>
            <p style="color: #6B7280; font-size: 1rem;">Join KiTABI and start your reading journey</p>
        </div>

        <!-- Registration Form -->
        <form method="post" action="{{ url_for('register') }}">
            <!-- Username Field -->
            <div style="margin-bottom: 1.5rem;">
                <label for="username"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-user" style="color: #10B981; margin-right: 0.5rem;"></i>Username
                </label>
                <input type="text" id="username" name="username" required placeholder="Choose a username"
                    style="width: 100%; padding: 0.75rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s;">
            </div>

            <!-- Email Field -->
            <div style="margin-bottom: 1.5rem;">
                <label for="email"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-envelope" style="color: #10B981; margin-right: 0.5rem;"></i>Email Address
                </label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com"
                    style="width: 100%; padding: 0.75rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s;">
            </div>

            <!-- Password Field -->
            <div style="margin-bottom: 2rem;">
                <label for="password"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-lock" style="color: #10B981; margin-right: 0.5rem;"></i>Password
                </label>
                <input type="password" id="password" name="password" required placeholder="Create a strong password"
                    style="width: 100%; padding: 0.75rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s;">
            </div>

            <!-- Submit Button -->
            <button type="submit"
                style="width: 100%; background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: white; padding: 0.875rem; border-radius: 10px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <!-- Login Link -->
        <div style="margin-top: 2rem; text-align: center; padding-top: 1.5rem; border-top: 2px solid #F3F4F6;">
            <p style="color: #6B7280; font-size: 0.95rem;">
                Already have an account?
                <a href="{{ url_for('login') }}"
                    style="color: #10B981; font-weight: 600; text-decoration: none; transition: all 0.3s;">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </a>
            </p>
        </div>
    </div>
</div>

<style>
    input:focus,
    select:focus {
        outline: none;
        border-color: #10B981 !important;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1) !important;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4) !important;
    }

    button:active {
        transform: translateY(0);
    }
</style>
{% endblock %}
