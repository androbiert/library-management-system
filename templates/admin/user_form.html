{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto; padding: 0 1.5rem;">
    <!-- Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
        <div
            style="background: linear-gradient(135deg, #10B981 0%, #059669 100%); width: 80px; height: 80px; margin: 0 auto 1.5rem; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);">
            <i class="fas fa-user-plus" style="font-size: 2.5rem; color: white;"></i>
        </div>
        <h2 style="color: #1F2937; font-size: 2rem; margin-bottom: 0.5rem; font-weight: 800;">
            <i class="fas fa-user-plus"></i> Add New User
        </h2>
        <p style="color: #6B7280; font-size: 1rem;">Register a new member to the library system</p>
    </div>

    <!-- Form Card -->
    <div style="background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);">
        <form method="post">
            <!-- Username Field -->
            <div style="margin-bottom: 1.5rem;">
                <label for="username"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-user" style="color: #10B981; margin-right: 0.5rem;"></i>Username
                </label>
                <input type="text" name="username" id="username" required placeholder="Enter username"
                    style="width: 100%; padding: 0.875rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s;">
            </div>

            <!-- Email Field -->
            <div style="margin-bottom: 1.5rem;">
                <label for="email"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-envelope" style="color: #10B981; margin-right: 0.5rem;"></i>Email Address
                </label>
                <input type="email" name="email" id="email" required placeholder="user@example.com"
                    style="width: 100%; padding: 0.875rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s;">
            </div>

            <!-- Password Field -->
            <div style="margin-bottom: 1.5rem;">
                <label for="password"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-lock" style="color: #10B981; margin-right: 0.5rem;"></i>Password
                </label>
                <input type="password" name="password" id="password" required placeholder="Create a secure password"
                    style="width: 100%; padding: 0.875rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s;">
                <small style="color: #6B7280; font-size: 0.85rem; display: block; margin-top: 0.5rem;">
                    <i class="fas fa-info-circle"></i> Minimum 6 characters recommended
                </small>
            </div>

            <!-- Role Field -->
            <div style="margin-bottom: 2rem;">
                <label for="role"
                    style="display: block; color: #374151; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.95rem;">
                    <i class="fas fa-user-tag" style="color: #10B981; margin-right: 0.5rem;"></i>Role
                </label>
                <select name="role" id="role"
                    style="width: 100%; padding: 0.875rem 1rem; border: 2px solid #E5E7EB; border-radius: 10px; font-size: 1rem; transition: all 0.3s; background-color: white; cursor: pointer;">
                    <option value="user">User (Regular Member)</option>
                    <option value="admin">Admin (Full Access)</option>
                </select>
            </div>

            <!-- Action Buttons -->
            <div style="display: flex; gap: 1rem; justify-content: space-between;">
                <a href="{{ url_for('manage_users') }}" class="button"
                    style="flex: 1; background: #6B7280; text-align: center; text-decoration: none;">
                    <i class="fas fa-arrow-left"></i> Cancel
                </a>
                <button type="submit" class="button"
                    style="flex: 1; background: linear-gradient(135deg, #10B981 0%, #059669 100%); border: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                    <i class="fas fa-check"></i> Add User
                </button>
            </div>
        </form>
    </div>
</div>

<style>
    input:focus,
    select:focus {
        outline: none;
        border-color: #10B981 !important;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1) !important;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4) !important;
    }
</style>
{% endblock %}
